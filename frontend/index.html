<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Recipe Finder</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>AI Recipe Finder</h1>
            <p>Take a picture of your ingredients and get a recipe!</p>
        </header>

        <main>
            <section class="image-capture-section">
                <h2>Capture Ingredients</h2>
                <div class="capture-area">
                    <div class="image-preview" id="imagePreview">
                        <p>No image captured yet</p>
                    </div>
                    <div class="capture-controls">
                        <button id="cameraButton" class="btn primary">Use Camera</button>
                        <button id="uploadButton" class="btn secondary">Upload Image</button>
                        <input type="file" id="fileInput" accept="image/*" style="display: none;">
                    </div>
                </div>
            </section>

            <section class="ingredients-section" id="ingredientsSection" style="display: none;">
                <h2>Identified Ingredients</h2>
                <div class="ingredients-list">
                    <ul id="ingredientsList"></ul>
                </div>
                <div class="section-controls">
                    <button id="getRecipeButton" class="btn primary">Get Recipe</button>
                    <button id="clearButton" class="btn secondary">Clear All</button>
                </div>
            </section>

            <section class="recipe-section" id="recipeSection" style="display: none;">
                <h2>Your Recipe</h2>
                <div class="recipe-display">
                    <h3 id="recipeTitle"></h3>
                    <div class="recipe-ingredients">
                        <h4>Ingredients:</h4>
                        <ul id="recipeIngredients"></ul>
                    </div>
                    <div class="recipe-instructions">
                        <h4>Instructions:</h4>
                        <p id="recipeInstructions"></p>
                    </div>
                </div>
                <div class="section-controls">
                    <button id="newRecipeButton" class="btn primary">Find Another Recipe</button>
                </div>
            </section>

            <div class="loading" id="loadingIndicator" style="display: none;">
                <div class="spinner"></div>
                <p id="loadingText">Processing...</p>
            </div>

            <div class="error-message" id="errorMessage" style="display: none;">
                <p id="errorText"></p>
                <button id="closeError" class="btn secondary">Close</button>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@google/generative-ai@0.1.3/dist/index.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
